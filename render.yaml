services:
  # FastAPI Backend Service on Render
  - type: web
    name: farm-action-loop-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: farm-action-loop-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false

databases:
  # Managed PostgreSQL Database on Render
  - name: farm-action-loop-db
    databaseName: farm_action_loop
    user: postgres
    plan: free
